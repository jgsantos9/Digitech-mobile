

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digitech Informática</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  color: white;
  background: url("https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=1600&q=80") no-repeat center center fixed;
  background-size: cover;
}

/* camada escura */
.overlay {
  background: rgba(0,0,0,0.75);
  min-height: 100vh;
  padding-bottom: 40px;
}

header {
  text-align: center;
  padding: 20px;
  border-bottom: 2px solid orange;
}

h1 {
  color: orange;
  margin: 0;
}

.container {
  padding: 15px;
}

.card {
  background: rgba(20,20,20,0.9);
  margin: 10px auto;
  padding: 15px;
  border-radius: 12px;
  max-width: 450px;
  border-left: 4px solid orange;
}

/* serviços clicáveis */
.servico {
  background: #222;
  padding: 10px;
  margin: 8px 0;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.2s;
}

.servico:hover {
  background: orange;
  color: black;
}

/* botões */
.btn {
  display: block;
  margin-top: 10px;
  padding: 12px;
  text-align: center;
  border-radius: 8px;
  background: orange;
  color: black;
  font-weight: bold;
  text-decoration: none;
}

.btn:hover {
  background: #ff8800;

  transform: translateY(-3px);

  box-shadow:
  0 10px 25px rgba(255,140,0,.45);

  filter: brightness(1.05);
}

footer {
  text-align: center;

  padding: 20px;

  color: #aaa;

  background: rgba(0,0,0,0.45);

  backdrop-filter: blur(8px);

  border-top:
  1px solid rgba(255,255,255,.05);

  font-size: 14px;
}
  
</style>
</head>

<body>

<div class="overlay">

<header>
  <h1>Digitech Informática</h1>
  <p>Redes • Computadores • Suporte Técnico</p>
</header>

<div class="container">

  <div class="card">
    <h2>📲 Atendimento Rápido</h2>
    <a class="btn" id="whatsBtn" href="#" target="_blank">
      Falar no WhatsApp
    </a>
  </div>

  <div class="card">
    <h2>🛠 Escolha seu Serviço</h2>

    <div class="servico" onclick="selecionar('Formatação de computador')">
      💻 Formatação de PC
    </div>

    <div class="servico" onclick="selecionar('Remoção de vírus')">
      🦠 Remoção de vírus
    </div>

    <div class="servico" onclick="selecionar('Instalação de redes e roteadores')">
      🌐 Redes e roteadores
    </div>

    <div class="servico" onclick="selecionar('Manutenção de computadores')">
      🔧 Manutenção de computadores
    </div>

    <div class="servico" onclick="selecionar('Suporte técnico remoto')">
      🖥 Suporte remoto
    </div>
  </div>

</div>

<footer>
  © 2026 Digitech Informática
</footer>

</div>

<script>
let servicoSelecionado = "";

function selecionar(servico) {
  servicoSelecionado = servico;
  alert("Serviço selecionado: " + servico);
  atualizarWhats();
}

function atualizarWhats() {
  let numero = "5587996263427";

  let texto = "Olá! Quero suporte de informática. Serviço: " + servicoSelecionado;

  document.getElementById("whatsBtn").href =
    "https://wa.me/" + numero + "?text=" + encodeURIComponent(texto);
}
</script>

</body>
</html>
